{% extends "admin/base.html" %}
{% load static i18n %}

{% block title %}{{ title }} | SoLuna Admin{% endblock %}

{% block branding %}
<a href="{% url 'admin:index' %}" class="sl-brand">
  <span class="sl-brand-icon">☾</span>
  <span class="sl-brand-text">SoLuna</span>
  <span class="sl-brand-tag">Admin</span>
</a>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'css/admin.css' %}">
{% endblock %}

{% block extrahead %}
{{ block.super }}
<script>document.documentElement.dataset.theme="light";</script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Tabular inline'larni grid'ga aylantirish
  document.querySelectorAll('.inline-group .tabular').forEach(function(table) {
    var thead = table.querySelector('thead');
    if (!thead) return;
    
    // Ustun nomlarini yig'ish
    var headers = [];
    thead.querySelectorAll('th').forEach(function(th) {
      var text = th.textContent.trim().replace(/\s+/g, ' ');
      if (text && !th.classList.contains('original')) {
        headers.push(text);
      }
    });
    
    // Har bir tr ga data-col-label qo'shish
    table.querySelectorAll('tbody tr').forEach(function(tr) {
      var tds = tr.querySelectorAll('td');
      var idx = 0;
      tds.forEach(function(td) {
        if (td.classList.contains('original') || td.classList.contains('delete')) {
          td.setAttribute('data-col-label', '');
          return;
        }
        if (idx < headers.length) {
          td.setAttribute('data-col-label', headers[idx]);
          idx++;
        }
      });
    });
  });
});
</script>
{% endblock %}
