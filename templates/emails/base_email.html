{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'uz' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ brand }}</title>
</head>
<body style="margin:0;padding:0;background:#f4efe6;font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:#2a2620;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4efe6;padding:28px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px;width:100%;background:#fffdf9;border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.07);">
          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#1c1a17,#2c2823);padding:26px 32px;text-align:center;">
              <img src="{{ logo_url }}" alt="{{ brand }}" width="44" height="44"
                   style="display:inline-block;vertical-align:middle;border-radius:8px;">
              <span style="color:#f2e9d5;font-size:22px;font-weight:700;letter-spacing:.5px;vertical-align:middle;margin-left:10px;">{{ brand }}</span>
            </td>
          </tr>
          <tr><td style="height:4px;line-height:4px;font-size:0;background:linear-gradient(90deg,#c9a84c,#e6cd82,#c9a84c);">&nbsp;</td></tr>

          <!-- Content -->
          <tr>
            <td style="padding:34px 34px 14px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:22px 34px 30px;border-top:1px solid #eee4d2;">
              <p style="margin:0;font-size:13px;line-height:1.6;color:#8a8172;">
                {% trans "Warm regards," %}<br>
                <strong style="color:#5a5140;">{{ brand }}</strong>
              </p>
              <p style="margin:12px 0 0;font-size:12px;color:#a89f8d;">
                <a href="{{ site_url }}" style="color:#c9a84c;text-decoration:none;">{{ site_url }}</a>
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:14px 0 0;font-size:11px;color:#b7ae9c;">© {{ brand }}</p>
      </td>
    </tr>
  </table>
</body>
</html>
