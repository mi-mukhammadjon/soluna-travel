{% load allauth %}
<div class="form-group">
  {% if attrs.type != "checkbox" and attrs.type != "radio" %}
    {% if slots.label %}
      <label for="{{ attrs.id }}" class="form-label">{% slot label %}{% endslot %}</label>
    {% endif %}
    <input
      {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
      {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
      {% if attrs.type %}type="{{ attrs.type }}"{% else %}type="text"{% endif %}
      {% if attrs.value != None %}value="{{ attrs.value|default_if_none:'' }}"{% endif %}
      {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
      {% if attrs.required %}required{% endif %}
      {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
      {% if attrs.autofocus %}autofocus{% endif %}
      class="form-control"
    >
    {% if slots.help_text %}
      <small style="color:var(--c-text-muted);font-size:0.8rem;display:block;margin-top:4px;">{% slot help_text %}{% endslot %}</small>
    {% endif %}
    {% if slots.errors %}
      <div class="field-error">{% slot errors %}{% endslot %}</div>
    {% endif %}
  {% else %}
    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:0.9rem;">
      <input
        {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
        {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
        type="{{ attrs.type }}"
        {% if attrs.value %}value="{{ attrs.value }}"{% endif %}
        {% if attrs.checked %}checked{% endif %}
        {% if attrs.required %}required{% endif %}
      >
      <span>{% if slots.label %}{% slot label %}{% endslot %}{% endif %}</span>
    </label>
  {% endif %}
</div>
