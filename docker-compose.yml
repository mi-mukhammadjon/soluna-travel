services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tour_agency}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8008:8008"
    volumes:
      - .:/app
      # staticfiles — BIND mount: collectstatic to'g'ridan-to'g'ri host ./staticfiles/ ga
      # yozadi, nginx aynan shu papkadan o'qiydi (named volume nginx'ga ko'rinmaydi).
      - ./staticfiles:/app/staticfiles
      # media — foydalanuvchi yuklamalari (avatar va h.k.). Serverda .env da
      # MEDIA_HOST_PATH=/var/www/soluna-travel/media qo'ying — nginx aynan shu
      # papkadan o'qiydi, Django ham shu yerga yozadi (real-time). Local: ./media.
      - ${MEDIA_HOST_PATH:-./media}:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "python /app/wait_for_db.py && celery -A config worker -l info"]
    volumes:
      - .:/app
      # media — foydalanuvchi yuklamalari (avatar va h.k.). Serverda .env da
      # MEDIA_HOST_PATH=/var/www/soluna-travel/media qo'ying — nginx aynan shu
      # papkadan o'qiydi, Django ham shu yerga yozadi (real-time). Local: ./media.
      - ${MEDIA_HOST_PATH:-./media}:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_beat:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "python /app/wait_for_db.py && celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"]
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  # 'media' named volume olib tashlandi — endi bind mount (MEDIA_HOST_PATH env)